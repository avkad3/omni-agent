[project]
name = "omni-agent"
version = "0.1.0"
description = "A pixels-only computer-use agent: it sees the screen, plans, and drives the mouse and keyboard. Runs locally on a 4 GB GPU."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "mss>=9",
    "pillow>=10",
    "numpy>=1.26",
    "pyautogui>=0.9.54",
    "pydirectinput>=1.0.4",
    "pynput>=1.7",
    "rapidocr-onnxruntime>=1.3",
    "onnxruntime>=1.17",
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13",
    # Windows' built-in OCR engine (0.1 s per 1080p screen); RapidOCR is used elsewhere.
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
omni-agent = "omni_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omni_agent*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"omni_agent/recorder.py" = ["E501"]  # inline HTML/CSS template

[tool.pytest.ini_options]
testpaths = ["tests"]
